name: Protocol keyless publishing

on:
  pull_request:
    paths: ['.github/workflows/publish.yml', 'scripts/Test-Release.ps1', 'scripts/Assert-ReleaseArtifact.ps1']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified package to nuget.org
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: protocol-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $version = [string]([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version.' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Test, pack and verify a fresh consumer
        shell: pwsh
        run: ./scripts/Test-Release.ps1
      - name: Check exact release identity and source provenance
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/Assert-ReleaseArtifact.ps1 -Directory "artifacts/release/$env:RELEASE_VERSION" -ExpectedVersion $env:RELEASE_VERSION -SourceCommit $env:GITHUB_SHA
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: protocol-tests
          path: artifacts/test-results/*.trx
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload
        with:
          name: protocol-release
          path: artifacts/release/${{ steps.version.outputs.version }}/
          if-no-files-found: error
          overwrite: false
          retention-days: 7

  publish:
    needs: verify
    if: github.repository == 'CrosswiredStudios/CSweet.ConnectionService' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          path: release
          merge-multiple: true
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Recheck the immutable verified artifact before authentication
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: ./scripts/Assert-ReleaseArtifact.ps1 -Directory release -ExpectedVersion $env:RELEASE_VERSION -SourceCommit $env:GITHUB_SHA
      - name: NuGet login with repository-scoped OIDC
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: CrosswiredStudios
      - name: Publish only the verified package
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet nuget push "release/CSweet.ConnectionService.Protocol.$env:RELEASE_VERSION.nupkg" --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY
